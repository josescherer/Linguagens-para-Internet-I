
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>exercicio implementação</title>

    <style>

        body {
            margin: 0;
            background-color: pink;
            font-family: "Comic Sans MS", cursive, sans-serif;
        }

        .container {

            width: 50%;
            background-color: yellow;

            border: 3px solid green;
            border-bottom: 4px dashed blue;
            border-top: 1px dashed black;
            border-right: 6px double orange;

            border-radius: 40px 40px 0px 0px;

            padding: 20px;

            margin-left: 10px;
            margin-top: 5px;

            box-sizing: border-box;
}

        p {
            margin: 0;
            font-size: 18px;
        }

    </style>

</head>

<body>

    <div class="container">

        <p>
            Comic-Sans é uma fonte odiada pelos designers, por isso eu gosto dela.
            Mas se não tiver, pode ser "cursive" ou "sans-serif". Este texto não pode
            estar encostado nas bordas. E este contêiner deve ocupar metade da largura da tela.
        </p>

    </div>

</body>

</html>
