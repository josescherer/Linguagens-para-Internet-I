<!doctype html>
<html>

<head>
    <title>Minha Página</title>

    <style>
    body{
        background-color: #FFFFFF;
        font-family: "Times New Roman";
    }
    
    h1{
        background-color: black;
        color: white;
        text-align: center;
    }
    
    li{
        border: 1px dotted red;
        margin: 15px;
    }
    
    table{
        margin: auto;
        border-collapse: collapse;
    }
    
    th{
        border: 1px dashed blue;
        font-size: 20px;
    }
    
    td{
        border: 1px dashed blue;
        text-align: center;
        font-size: 18px;
    }
    
    .destaque{
        color: red;
    }
    
    a{
        color: darkred;
        font-weight: bold;
    } 
    </style>
</head>

<body>
    <h1>Minha Página</h1>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <table>
        <tr>
            <th>Cabeçalho 1</th>
            <th>Cabeçalho 2</th>
            <th>Cabeçalho 3</th>
        </tr>
        <tr>
            <td>Célula 1</td>
            <td class="destaque">Célula 2</td>
            <td>Célula 3</td>
        </tr>
    </table> Isto é um link para o Google: <a href="http://www.google.com">Google</a>
</body>

</html>
