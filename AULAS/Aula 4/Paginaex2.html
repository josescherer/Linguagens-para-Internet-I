    <body>
        <header>

        <section>
            <b>The ingredients</b>
            <dl>
                <dt><b>The ingredients</b></dt>
                <dd>• 100 g. flour</dd>
                <dd>• 10 g. sugar</dd>
                <dd>• 1 cup water</dd>
                <dd>• 2 eggs</dd>
                <dd>• salt, pepper</dd>
            </dl>
            <dl>
                <dt><b>The procedure:</b></dt>
                <dd>1. Mix dry ingredients thoroughly.</dd>
                <dd>2. Pour in wet ingredients.</dd>
                <dd>3. Mix for 10 minutes.</dd>
                <dd>4. Bake for one hour at 300 degrees.</dd>
            </dl>

            <b>Notes:</b>
            <p id="notes">The recipe may be improved by adding raisins.</p>
