    <body>
        <header>

        <section>
            <b>The ingredients</b>
            <ul>
                <li>100 g. flour</li>
                <li>10 g. sugar</li>
                <li>1 cup water</li>
                <li>2 eggs</li>
                <li>salt, pepper</li>
            </ul>

            <b>The procedure:</b>
            <ol>
                <li>Mix dry ingredients thoroughly.</li>
                <li>Pour in wet ingredients.</li>
                <li>Mix for 10 minutes.</li>
                <li>Bake for one hour at 300 degrees.</li>
            </ol>

            <b>Notes:</b>
            <p id="notes">The recipe may be improved by adding raisins.</p>
        </section>
